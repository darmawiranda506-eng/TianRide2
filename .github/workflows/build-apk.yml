name: Build TianRide APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"
          sdkmanager "ndk;28.2.13676358"
          sdkmanager "cmake;3.22.1"
          yes | sdkmanager --licenses || true

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Get Flutter packages
        run: flutter pub get

      - name: Build Customer APK
        run: flutter build apk --debug --flavor customer --dart-define=APP_FLAVOR=customer

      - name: Build Driver APK
        run: flutter build apk --debug --flavor driver --dart-define=APP_FLAVOR=driver

      - name: Build Admin APK
        run: flutter build apk --debug --flavor admin --dart-define=APP_FLAVOR=admin

      - name: Prepare APK files
        run: |
          mkdir -p artifacts

          cp build/app/outputs/flutter-apk/app-customer-debug.apk \
            artifacts/TianRide-Customer-debug.apk

          cp build/app/outputs/flutter-apk/app-driver-debug.apk \
            artifacts/TianRide-Driver-debug.apk

          cp build/app/outputs/flutter-apk/app-admin-debug.apk \
            artifacts/TianRide-Admin-debug.apk

          ls -lh artifacts

      - name: Upload TianRide APKs
        uses: actions/upload-artifact@v4
        with:
          name: TianRide-3-APKs
          path: artifacts/*.apk
          if-no-files-found: error
